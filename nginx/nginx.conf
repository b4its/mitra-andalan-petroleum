# Reverse proxy untuk produksi.
# Frontend (Nuxt SSR) di :3012, Backend (FastAPI) di :8012.
# Ngrok men-tunnel port 92 (nginx) ke domain publik.

worker_processes auto;
events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Batas ukuran upload (file tanda tangan, dokumen, dll)
  client_max_body_size 100m;

  # Header 'Upgrade' hanya diteruskan saat klien benar-benar meminta
  # WebSocket; request HTTP biasa memakai keepalive ke upstream.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # Keepalive ke upstream mencegah koneksi baru per request (mengurangi
  # churn yang bisa memicu reset koneksi saat halaman dimuat dengan
  # banyak request paralel).
  upstream frontend {
    server frontend:3012;
    keepalive 64;
  }
  upstream backend {
    server backend:8012;
    keepalive 64;
  }

  server {
    listen 92;
    server_name _;

    # ── API Backend ────────────────────────────────────────────
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
    }

    # ── Media / Upload (file statis backend) ───────────────────
    location /media/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
    }

    location /uploads/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    # ── Frontend (Nuxt SSR) ────────────────────────────────────
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
