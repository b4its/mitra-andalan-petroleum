services:
  db:
    image: mysql:8.0
    container_name: mandalan-db
    restart: unless-stopped
    command: ["mysqld", "--port=3318"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: mandalan
      MYSQL_PASSWORD: mandalan
      MYSQL_DATABASE: mandalan
    ports:
      - "3318:3318"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - core
      - full

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandalan-backend
    restart: unless-stopped
    command: ["python", "-m", "app.db.boot"]
    ports:
      - "8012:8012"
    environment:
      DATABASE_URL: mysql+aiomysql://mandalan:mandalan@db:3318/mandalan
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/docs', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    profiles:
      - core
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mandalan-frontend
    restart: unless-stopped
    ports:
      - "8092:3012"
    environment:
      NUXT_API_PROXY_TARGET: http://backend:8012/api/v1
      NUXT_MEDIA_PROXY_TARGET: http://backend:8012/media
      PORT: "3012"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - full

volumes:
  mysqldata:
  media_data:
