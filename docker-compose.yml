services:
  db:
    image: mysql:8.0
    container_name: mandalan-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: mandalan
      MYSQL_PASSWORD: mandalan
      MYSQL_DATABASE: mandalan
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - core
      - full

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandalan-backend
    restart: unless-stopped
    command: sh -c "python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://mandalan:mandalan@db:3306/mandalan
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - core
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mandalan-frontend
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      NUXT_API_PROXY_TARGET: http://backend:8000/api/v1
      NUXT_MEDIA_PROXY_TARGET: http://backend:8000/media
    depends_on:
      - backend
    profiles:
      - full

volumes:
  mysqldata:
  media_data:
